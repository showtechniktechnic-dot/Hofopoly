<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOFOPOLY Online</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>
:root{--g:#0a4b31;--dg:#063522;--c:#f3ecd9;--p:#fffaf0;--y:#d4ad45;--r:#a52e2e;--b:#d7ccb5}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#26332c;font-family:Georgia,serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 12px;margin:3px;font-weight:700;background:#e5dcc9}.primary{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.gold{background:#dfbb4d}.top{background:var(--dg);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.logo{font-size:23px;font-weight:900;letter-spacing:.08em}.logo span{color:#e3c45e}.wrap{max-width:1350px;margin:auto;padding:15px}.hero,.card{background:var(--p);border:1px solid var(--b);border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.hero{border:3px solid var(--g);background:linear-gradient(135deg,#fffdf6,#eadfbd)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span6{grid-column:span 6}.span12{grid-column:span 12}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap}.active{background:var(--g);color:white}.group{background:white;border:2px solid var(--b);border-radius:13px;padding:12px}.muted{font:13px Arial,sans-serif;color:#68716b}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee6d5;font:700 11px Arial}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.prop{background:white;border:2px solid #b9ad92;border-radius:12px;padding:9px;min-height:115px}.stripe{height:8px;background:var(--g);border-radius:6px;margin:-1px -1px 8px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;place-items:center;padding:15px}.modal.show{display:grid}.modalbox{background:var(--p);width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.login{min-height:100vh;display:grid;place-items:center;background:var(--dg);padding:18px}.loginbox{width:min(500px,100%);background:var(--p);border:4px solid var(--y);border-radius:24px;padding:25px}.loginbox h1{text-align:center;font-size:40px;margin:0}.input{width:100%;padding:13px;border:1px solid #c8bda5;border-radius:10px;margin:7px 0}table{width:100%;border-collapse:collapse;font:13px Arial,sans-serif}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:left}.rank{display:grid;grid-template-columns:35px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}@media(max-width:750px){.span6{grid-column:span 12}.board{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="app"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script>
const SUPABASE_URL='https://wmfizptyunpdflyoaseo.supabase.co',KEY='sb_publishable_rzGd5bzeQfxiWWKbsdbrzw_7QMcYI5N';const ACCESS={
'HOF-ADMIN-7264':{role:'admin'},'HOF-APFEL-3819':{role:'employee',no:1,groups:[1,2]},'HOF-WIESE-5427':{role:'employee',no:2,groups:[3,4,5]},'HOF-STROH-8642':{role:'employee',no:3,groups:[6,7,8]},'HOF-STALL-1935':{role:'employee',no:4,groups:[9,10]},'HOF-EREIGNIS-6048':{role:'event'}};let sb,me,game,groups=[],props=[],owners=[],tx=[],archives=[],view='dashboard';
const EVENT_CARDS=[
{id:1,title:'Gute Ernte',positive:true,text:'Die Ernte war besonders erfolgreich. Die Gruppe erhält 30 €.',money:30},
{id:2,title:'Fleißiger Helfer',positive:true,text:'Ein Helfer unterstützt den Hof. Die Gruppe erhält 20 €.',money:20},
{id:3,title:'Markttag',positive:true,text:'Auf dem Markt wurden gute Preise erzielt. Die Gruppe erhält 15 €.',money:15},
{id:4,title:'Glücklicher Fund',positive:true,text:'Auf dem Hof wurde etwas Wertvolles gefunden. Die Gruppe erhält 10 €.',money:10},
{id:5,title:'Silberne Lieferung',positive:true,text:'Eine Lieferung kommt früher als erwartet. Die Gruppe erhält 1 Silber.',silver:1},
{id:6,title:'Doppelte Belohnung',positive:true,text:'Der Hof bekommt eine Sonderprämie. Die Gruppe erhält 2 Silber.',silver:2},
{id:7,title:'Goldener Moment',positive:true,text:'Ein besonderer Auftrag bringt eine Goldprämie. Die Gruppe erhält 1 Gold.',gold:1},
{id:8,title:'Kaputter Zaun',positive:false,text:'Ein Zaun muss dringend repariert werden. Die Gruppe verliert 20 €.',money:-20},
{id:9,title:'Schlechte Ernte',positive:false,text:'Ein Teil der Ernte ist verdorben. Die Gruppe verliert 30 €.',money:-30},
{id:10,title:'Werkzeug kaputt',positive:false,text:'Wichtiges Werkzeug geht kaputt. Die Gruppe verliert 1 Silber.',silver:-1}
];
const euro=n=>Number(n).toLocaleString('de-DE')+' €';const g=n=>groups.find(x=>x.group_number===n);const allowed=n=>me.role==='admin'||me.groups.includes(n);const val=b=>b==='hotel'?200:b==='house'?100:50;const total=x=>x.money+x.silver*10+x.gold*40+owners.filter(o=>o.group_id===x.id).reduce((s,o)=>s+val(o.building),0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('show')}function hide(){document.getElementById('modal').classList.remove('show')}async function load(){
  let q=await sb.from('games').select('*')
    .in('status',['setup','round1','round2','paused'])
    .order('created_at',{ascending:false}).limit(1);
  game=q.data?.[0];

  const ar=await sb.from('game_archives').select('*')
    .order('finished_at',{ascending:false}).limit(50);
  archives=ar.data||[];

  if(!game){
    groups=[];props=[];owners=[];tx=[];
    return;
  }

  groups=(await sb.from('game_groups').select('*')
    .eq('game_id',game.id).order('group_number')).data||[];

  props=(await sb.from('properties').select('*')
    .eq('game_id',game.id).order('photo_number')).data||[];

  owners=(await sb.from('property_owners').select('*')
    .in('property_id',props.map(p=>p.id))).data||[];

  tx=(await sb.from('transactions').select('*')
    .eq('game_id',game.id)
    .order('created_at',{ascending:false}).limit(300)).data||[];
}
function status(){return({setup:'Bereit',round1:'Runde 1',round2:'Runde 2',paused:'Pausiert'})[game?.status]||'—'}function loginPage(){document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><h1>HOF<span>OPOLY</span></h1><p class="muted">Bauernhof trifft Monopoly · Online-Spielverwaltung</p><p class="badge">Online-Version 2026-08-25</p><input id="key" class="input" placeholder="Zugangsschlüssel"><button class="primary" style="width:100%" onclick="login()">Spielzugang öffnen</button></div></div>'}async function login(){let raw=document.getElementById('key').value.replace(/[\u00a0\u2007\u202f]/g,' ').trim();let k=raw.toUpperCase().replace(/\s+/g,'');if(!ACCESS[k])return alert('Ungültiger Zugangsschlüssel. Bitte genau einen der fünf HOFOPOLY-Zugangsschlüssel eingeben.');me=ACCESS[k];localStorage.hofopoly=k;await start()}async function start(){
try{
if(!window.supabase||!window.supabase.createClient) throw new Error('Supabase-Bibliothek konnte nicht geladen werden. Internetverbindung prüfen.');
sb=window.supabase.createClient(SUPABASE_URL,KEY);
await load();
if(!game){if(me.role==='event'){renderEvent();}else{renderNoGame();}return;}
render();
sb.channel('hofopoly-live').on('postgres_changes',{event:'*',schema:'public'},async()=>{await load();render()}).subscribe();
}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><h1>HOF<span>OPOLY</span></h1><h2>Verbindungsfehler</h2><p>'+esc(e?.message||e)+'</p><p class="muted">Supabase: '+esc(URL)+'</p><button class="primary" onclick="location.reload()">Erneut versuchen</button></div></div>';}
}function logout(){localStorage.removeItem('hofopoly');location.reload()}
function renderNoGame(){
  document.getElementById('app').innerHTML=headerNoGame()+`
  <main class="wrap">
    <section class="hero">
      <h1>Hofopoly Spielzentrale</h1>
      <p class="muted">Aktuell läuft kein Spiel. Abgeschlossene Spiele bleiben im Archiv gespeichert.</p>
      ${me.role==='admin'?`<button class="primary" onclick="newGame()">🆕 Neues Spiel anlegen</button>`:''}
    </section>
    <section class="card">
      <h2>📜 Gespeicherte Spiele</h2>
      ${archiveList()}
    </section>
  </main>`;
}
function headerNoGame(){
  return `<div class="top"><div class="logo">HOF<span>OPOLY</span></div><div class="row"><b>${me.role==='admin'?'👑 Admin':me.role==='event'?'🃏 Ereigniskarten':'👨‍🌾 Mitarbeiter '+me.no}</b><button onclick="logout()">Abmelden</button></div></div>`;
}
function header(){return `<div class="top"><div class="logo">HOF<span>OPOLY</span></div><div class="row"><b>${me.role==='admin'?'👑 Admin':me.role==='event'?'🃏 Ereigniskarten':'👨‍🌾 Mitarbeiter '+me.no}</b><span class="badge">${status()}</span><button onclick="logout()">Abmelden</button></div></div>`}function render(){
  if(me.role==='event'){renderEvent();return;}
  document.getElementById('app').innerHTML=header()+`<main class="wrap"><section class="hero"><div class="row"><div><h1>Hofopoly Spielzentrale</h1><p class="muted">Gemeinsamer Live-Spielstand für alle iPads.</p></div><b>${status()}</b></div></section><nav class="tabs">${['dashboard','properties','tasks','rules','history'].map(v=>`<button class="tab ${view===v?'active':''}" onclick="view='${v}';render()">${{dashboard:'Dashboard',properties:'Grundstücke',tasks:'Ressourcen',rules:'Spielregeln',history:'Historie'}[v]}</button>`).join('')}${me.role==='admin'?`<button class="tab ${view==='admin'?'active':''}" onclick="view='admin';render()">Admin</button>`:''}</nav><div id="content"></div></main>`;document.getElementById('content').innerHTML=view==='dashboard'?dashboard():view==='properties'?properties():view==='tasks'?tasks():view==='rules'?rules():view==='history'?history():admin();
}
function renderEvent(){document.getElementById('app').innerHTML=headerNoGame()+`<main class="wrap"><section class="hero"><h1>🃏 Ereigniskarten</h1><p class="muted">Wähle eine Gruppe und ziehe eine der 10 Ereigniskarten. 7 Karten sind positiv, 3 negativ. Jede Karte darf pro Spiel nur einmal verwendet werden.</p></section>${!game?`<section class="card"><h2>Kein aktives Spiel</h2><p>Warte, bis der Admin eine Spielrunde startet.</p></section>`:game.status==='setup'?`<section class="card"><h2>Spiel noch nicht gestartet</h2><p>Die Ereigniskarten werden erst ab Runde 1 freigeschaltet.</p></section>`:`<section class="card"><h2>Gruppe auswählen</h2><div class="grid">${groups.map(x=>`<button class="primary span6" onclick="eventFor(${x.group_number})">Gruppe ${x.group_number} · ${euro(x.money)}</button>`).join('')}</div></section><section class="card"><h2>Karten</h2><div class="grid">${EVENT_CARDS.map(c=>`<div class="group span6"><div class="row"><h3>${c.title}</h3><span class="badge">${c.positive?'POSITIV':'NEGATIV'}</span></div><p>${c.text}</p><button class="${c.positive?'primary':'danger'}" onclick="eventFor(null,${c.id})">${c.positive?'✨':'⚠️'} Karte auswählen</button></div>`).join('')}</div></section>`}</main>`}
function eventFor(groupNo,cardId){let groupPart=groupNo?`<h3>Gruppe ${groupNo} ausgewählt</h3>`:`<h3>Gruppe auswählen</h3><div>${groups.map(x=>`<button onclick="eventFor(${x.group_number},${cardId||'null'})">Gruppe ${x.group_number}</button>`).join('')}</div>`;let cards=cardId?EVENT_CARDS.filter(c=>c.id===cardId):EVENT_CARDS;show(`${groupPart}<div class="grid">${cards.map(c=>`<div class="group span12"><h2>${c.title}</h2><p>${c.text}</p><button class="${c.positive?'primary':'danger'}" onclick="applyEvent(${groupNo},${c.id})">Karte anwenden</button></div>`).join('')}</div><button onclick="hide()">Abbrechen</button>`)}
async function applyEvent(groupNo,cardId){if(game.status==='finished'||game.status==='setup')return alert('Ereigniskarten sind erst nach dem Spielstart verfügbar.');let c=EVENT_CARDS.find(x=>x.id===cardId);let {data,error}=await sb.rpc('apply_event_card',{p_game_id:game.id,p_group_number:groupNo,p_card_number:cardId,p_money_delta:c.money||0,p_silver_delta:c.silver||0,p_gold_delta:c.gold||0,p_title:c.title,p_text:c.text});if(error){alert(error.message);return;}hide();await load();render();alert(`Ereigniskarte: ${c.title}`)}
function dashboard(){let r=[...groups].sort((a,b)=>total(b)-total(a));return `<div class="grid"><section class="card span12"><div class="row"><h2>Gruppen</h2><span class="badge">50 € Startgeld</span></div><div class="grid">${groups.map(x=>`<div class="group span6"><div class="row"><h3>Gruppe ${x.group_number}</h3><b>${euro(x.money)}</b></div><div class="row"><span>⚪ ${x.silver} Silber</span><span>🟡 ${x.gold} Gold</span><b>${euro(total(x))}</b></div>${allowed(x.group_number)?`<button class="primary" onclick="photo(${x.group_number})">📸 Foto</button><button onclick="house(${x.group_number})">🏠 Haus</button><button class="gold" onclick="hotel(${x.group_number})">🏨 Hotel</button>${game.status==='round2'?`<button onclick="task(${x.group_number})">🎯 Aufgabe</button>`:''}`:''}</div>`).join('')}</div></section><section class="card span6"><h2>🏆 Rangliste</h2>${r.map((x,i)=>`<div class="rank"><b>${i+1}</b><span>Gruppe ${x.group_number}</span><b>${euro(total(x))}</b></div>`).join('')}</section><section class="card span6"><h2>Spielregeln kurz</h2><p>Foto 1–3: Bauplatz. Foto 4+: automatisch 50 € Miete.</p><p>Haus 2 Silber · Hotel 2 Silber + 1 Gold.</p></section></div>`}
function properties(){return `<section class="card"><h2>🏞️ Grundstücke</h2><div class="board">${props.map(p=>{let os=owners.filter(o=>o.property_id===p.id);return `<div class="prop"><div class="stripe"></div><b>Foto ${p.photo_number}</b><div class="muted">50 € / 100 € / 200 €</div><hr>${os.length?os.map(o=>`Gruppe ${groups.find(x=>x.id===o.group_id)?.group_number||'?'} · ${o.building==='hotel'?'🏨':o.building==='house'?'🏠':'🌱'}`).join('<br>'):'<span class="muted">frei</span>'}</div>`}).join('')}</div></section>`}function tasks(){if(game.status!=='round2')return `<section class="card"><h2>🔒 Ressourcenaufgaben</h2><p>Die Aufgaben werden erst freigeschaltet, wenn der Admin <b>Runde 2</b> startet.</p></section>`;return `<section class="card"><h2>🎯 Ressourcenaufgaben</h2><p>Alle Gruppen können zu jeder Station. Schwierigkeit wählen; Gold bei schwer wird per Zufall mit 1/3 vergeben.</p>${groups.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--b)"><b>Gruppe ${x.group_number}</b><span>⚪ ${x.silver} · 🟡 ${x.gold}</span>${allowed(x.group_number)?`<button class="primary" onclick="task(${x.group_number})">Aufgabe</button>`:''}</div>`).join('')}</section>`}function rules(){return `<section class="card"><h2>📖 Spielregeln</h2><ol><li>10 Gruppen starten mit 50 €.</li><li>20 Fotos, je 3 Bauplätze.</li><li>Jede Gruppe kann jedes Foto nur einmal verwenden.</li><li>Beim 4. Fund eines Motivs werden automatisch 50 € Miete an die drei bisherigen Besitzer verteilt.</li><li>Haus: 2 Silber → Grundstückswert 100 €.</li><li>Hotel: 2 Silber + 1 Gold, Haus vorausgesetzt → 200 €.</li><li>Leicht 1 Silber · Mittel 2 Silber · Schwer 3 Silber.</li><li>Bei schwer: 1/3 Zufallschance auf 1 Gold.</li><li>Endabrechnung: Silber 10 €, Gold 40 €.</li></ol></section>`}function history(){return `<section class="card"><h2>📜 Historie</h2><table><tr><th>Zeit</th><th>Gruppe</th><th>Typ</th><th>€</th><th>Details</th></tr>${tx.map(t=>`<tr><td>${new Date(t.created_at).toLocaleTimeString('de-DE')}</td><td>${groups.find(x=>x.id===t.group_id)?.group_number||'—'}</td><td>${esc(t.type)}</td><td>${t.amount||0}</td><td>${esc(t.details)}</td></tr>`).join('')}</table></section>`}
function admin(){return `<section class="card"><h2>👑 Admin – Spielsteuerung</h2><p class="muted">Runde 1: Fotos und Grundstücke. Runde 2: zusätzlich Ressourcenaufgaben.</p><button class="primary" ${game.status!=='setup'?'disabled':''} onclick="call('start_game',{p_game_id:game.id})">▶ Runde 1 starten</button><button class="primary" ${game.status!=='round1'?'disabled':''} onclick="call('start_round2',{p_game_id:game.id})">🟢 Runde 2 aktivieren</button><button ${!['round1','round2'].includes(game.status)?'disabled':''} onclick="call('pause_game',{p_game_id:game.id})">⏸ Pausieren</button><button ${game.status!=='paused'?'disabled':''} onclick="call('resume_game',{p_game_id:game.id})">▶ Fortsetzen</button><button class="danger" ${game.status==='setup'?'disabled':''} onclick="endGame()">⛔ Beenden & archivieren</button></section><section class="card"><h2>🆕 Neue Spielrunde</h2><p>Ein neues Spiel kann erst angelegt werden, nachdem das aktuelle Spiel archiviert wurde.</p><button class="primary" onclick="finishAndNewGame()">🆕 Spiel archivieren & neues Spiel starten</button></section><section class="card"><h2>🏆 Aktueller Spielstand</h2><table><tr><th>Gruppe</th><th>Geld</th><th>Silber</th><th>Gold</th><th>Endwert</th></tr>${[...groups].sort((a,b)=>total(b)-total(a)).map(x=>`<tr><td>${x.group_number}</td><td>${euro(x.money)}</td><td>${x.silver}</td><td>${x.gold}</td><td><b>${euro(total(x))}</b></td></tr>`).join('')}</table></section><section class="card"><h2>📚 Archiv vergangener Spiele</h2>${archiveList()}</section>`}
function archiveList(){if(!archives.length)return '<p class="muted">Noch keine abgeschlossenen Spiele.</p>';return `<div>${archives.map(a=>{let d=a.final_data||{};let gs=d.groups||[];return `<details class="group" style="margin:8px 0"><summary><b>${esc(a.game_name)}</b> · ${new Date(a.finished_at).toLocaleString('de-DE')} · ${gs.length} Gruppen</summary><table><tr><th>Gruppe</th><th>Geld</th><th>Silber</th><th>Gold</th><th>Endwert</th></tr>${gs.sort((x,y)=>{let xv=x.money+x.silver*10+x.gold*40;let yv=y.money+y.silver*10+y.gold*40;return yv-xv}).map(x=>`<tr><td>${x.group_number}</td><td>${euro(x.money)}</td><td>${x.silver}</td><td>${x.gold}</td><td>${euro(x.money+x.silver*10+x.gold*40)}</td></tr>`).join('')}</table></details>`}).join('')}</div>`}
async function call(fn,args){let {error}=await sb.rpc(fn,args);if(error)alert(error.message);else{await load();render()}}
function photo(n){show(`<h2>📸 Foto · Gruppe ${n}</h2><p class="muted">Der 4. Fund eines Motivs löst automatisch 50 € Miete aus.</p>${props.map(p=>{let c=owners.filter(o=>o.property_id===p.id).length;return `<button class="${c<3?'primary':'gold'}" onclick="findPhoto(${n},${p.photo_number})">Foto ${p.photo_number} · ${c}/3</button>`}).join('')}<button onclick="hide()">Abbrechen</button>`)}async function findPhoto(n,p){let {error}=await sb.rpc('find_photo',{p_game_id:game.id,p_group_number:n,p_photo_number:p});if(error)alert(error.message);else{hide();await load();render()}}
function house(n){let x=g(n),o=owners.filter(z=>z.group_id===x.id&&z.building==='plot');if(x.silver<2||!o.length)return alert('2 Silber und ein freier Bauplatz nötig.');show(`<h2>🏠 Haus bauen</h2>${o.map(z=>`<button class="primary" onclick="buildHouse(${n},${z.property_id})">Foto ${props.find(p=>p.id===z.property_id)?.photo_number}</button>`).join('')}<button onclick="hide()">Abbrechen</button>`)}async function buildHouse(n,pid){let p=props.find(x=>x.id===pid);let {error}=await sb.rpc('build_house',{p_game_id:game.id,p_group_number:n,p_photo_number:p.photo_number});if(error)alert(error.message);else{hide();await load();render()}}
function hotel(n){let x=g(n),o=owners.filter(z=>z.group_id===x.id&&z.building==='house');if(x.silver<2||x.gold<1||!o.length)return alert('2 Silber + 1 Gold und ein Haus nötig.');show(`<h2>🏨 Hotel bauen</h2>${o.map(z=>`<button class="gold" onclick="buildHotel(${n},${z.property_id})">Foto ${props.find(p=>p.id===z.property_id)?.photo_number}</button>`).join('')}<button onclick="hide()">Abbrechen</button>`)}async function buildHotel(n,pid){let p=props.find(x=>x.id===pid);let {error}=await sb.rpc('build_hotel',{p_game_id:game.id,p_group_number:n,p_photo_number:p.photo_number});if(error)alert(error.message);else{hide();await load();render()}}
const taskTexts={easy:['Finde etwas Rotes und zeige es.','Mache 8 Hampelmänner.','Nenne drei Bauernhoftiere.'],medium:['Finde zwei Dinge derselben Farbe.','Mache 10 Kniebeugen.','Finde drei Naturmaterialien.'],hard:['Finde in 60 Sekunden etwas Natürliches, Rundes und Blaues.','Macht gemeinsam 20 Sprünge.','Finde etwas aus Holz, Metall und Stoff.','Merkt euch drei Gegenstände und nennt sie nach 30 Sekunden wieder.']};async function task(n){if(game.status!=='round2')return alert('Die Ressourcenaufgaben werden erst mit Runde 2 freigeschaltet.');show(`<h2>🎯 Aufgabe · Gruppe ${n}</h2><button class="primary" onclick="giveTask(${n},'easy')">Leicht · 1 Silber</button><button class="primary" onclick="giveTask(${n},'medium')">Mittel · 2 Silber</button><button class="gold" onclick="giveTask(${n},'hard')">Schwer · 3 Silber + 1/3 Gold</button><button onclick="hide()">Abbrechen</button>`)}async function giveTask(n,l){let {data}=await sb.from('tasks').select('id,task_text').eq('difficulty',l).eq('active',true);let q=data[Math.floor(Math.random()*data.length)];show(`<h2>${l==='hard'?'🟡 Schwer':l==='medium'?'⚪ Mittel':'⚪ Leicht'}</h2><p style="font-size:20px">${esc(q.task_text)}</p><button class="primary" onclick="reward(${n},'${l}',${q.id?'true':'false'},'${q.id}')">Geschafft</button><button class="danger" onclick="reward(${n},'${l}',false,'${q.id}')">Nicht geschafft</button>`)}async function reward(n,l,ok,id){let {data,error}=await sb.rpc('complete_task',{p_game_id:game.id,p_group_number:n,p_task_id:id,p_success:ok});if(error)alert(error.message);else{hide();await load();render();alert(ok?`+${data.silver} Silber${data.gold?' + 1 Gold!':''}`:'Keine Ressource.')}}async function newGame(){
  if(me.role!=='admin')return alert('Nur der Admin kann ein neues Spiel anlegen.');
  const {data,error}=await sb.rpc('create_new_game');
  if(error){alert(error.message);return;}
  await load();view='dashboard';render();
}
async function finishAndNewGame(){
  if(me.role!=='admin')return;
  if(!confirm('Aktuelles Spiel archivieren und anschließend ein neues Spiel mit 50 € Startkapital anlegen?'))return;
  let r=await sb.rpc('finish_and_archive_game',{p_game_id:game.id});
  if(r.error){alert(r.error.message);return;}
  r=await sb.rpc('create_new_game');
  if(r.error){alert('Spiel wurde archiviert, aber das neue Spiel konnte nicht angelegt werden: '+r.error.message);await load();renderNoGame();return;}
  await load();view='dashboard';render();
}
async function endGame(){if(!confirm('Spiel beenden und archivieren?'))return;let {data,error}=await sb.rpc('finish_and_archive_game',{p_game_id:game.id});if(error)alert(error.message);else{alert('Spiel archiviert. Archiv-ID: '+data);await load();renderNoGame()}}
window.addEventListener('error',e=>console.error('HOFOPOLY:',e.error||e.message));
(async()=>{
try{
let raw=localStorage.hofopoly||'';let k=raw.toUpperCase().replace(/\s+/g,'');
if(k&&ACCESS[k]){me=ACCESS[k];localStorage.hofopoly=k;await start()}
else{localStorage.removeItem('hofopoly');loginPage()}
}catch(e){console.error(e);loginPage();alert('Startfehler: '+(e?.message||e))}
})();
</script></body></html>
